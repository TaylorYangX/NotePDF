[project]
name = "notepdf"
version = "0.1.0"
description = "Add highlights and comments to PDFs from a config file or from colored markers in LaTeX sources."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"  # PyMuPDF is AGPL
dependencies = [
    "pymupdf>=1.24",
    "pyyaml>=6.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
fuzzy = ["rapidfuzz>=3.0"]
gui = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
notepdf = "notepdf.cli:main"

[dependency-groups]
dev = [
    # the optional features, so a plain `uv sync` can run every test
    "rapidfuzz>=3.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx2>=2.14.0",
    "pypdf>=6.21.4",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notepdf"]
artifacts = ["src/notepdf/gui/dist/**"]  # the built UI is git-ignored but belongs in the wheel

[tool.pytest.ini_options]
testpaths = ["tests"]

[package]
name = "notepdf-app"  # not "notepdf": that is the command-line tool
version = "0.1.0"
description = "NotePDF: highlights and comments for PDFs"
edition = "2021"
rust-version = "1.80"

[lib]
name = "notepdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
